<main class="container" *ngIf="!!categories">
  <app-category-card (click)="goToProblemList(category)" class="app-card" *ngFor="let category of categories"
    [id]="category.id" [title]="category.title" [description]="category.description" [color]="getCardColor(category.id)"
    [totalProblems]="category.total_problems"></app-category-card>
</main>
